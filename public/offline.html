<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#587458" />
  <title>Sem conexão — Nova Berith</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf6ef; color: #3a2a26; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; }
    img { width: 220px; max-width: 70%; height: auto; }
    h1 { color: #587458; font-size: 1.4rem; margin: 20px 0 8px; }
    p { line-height: 1.5; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #587458; color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/logo-cor.png" alt="Nova Berith" />
    <h1>Você está sem conexão</h1>
    <p>O aplicativo precisa de internet para mostrar e salvar informações. Nada que você tentou fazer foi salvo. Conecte-se e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
